interface:
  display_name: AppKit Accessibility Auditor
  short_description: Audit or implement focused AppKit accessibility issues with fixes for VoiceOver, keyboard navigation, tables, and custom controls.
  default_prompt: Use $apple-appdev-workflow:appkit-accessibility-auditor to review this AppKit screen or control for focused accessibility issues, apply the necessary fixes, and return the manual verification checklist. Do not treat broad release-claim accessibility audits as direct AppKit-auditor work.
